plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'application'
    id 'com.github.johnrengelman.shadow'
}

group = 'com.hiperbou.vm'
version = '1.0-SNAPSHOT'

repositories {
    jcenter()
    mavenCentral()
    maven { url 'https://maven.pkg.jetbrains.space/public/p/kotlinx-html/maven' }
}

kotlin {
    jvm() {
        compilations.all {
            kotlinOptions.jvmTarget = '1.8'
        }
        withJava()
        testRuns["test"].executionTask.configure {
            useJUnitPlatform()
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation project(':vm')
                implementation project(':ccompiler')
            }
        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
        jvmMain {
            dependencies {
            }
        }
        jvmTest {

        }

    }
}

application {
    mainClassName = 'com.hiperbou.vm.ccompilerbin.MainKt'
}



tasks.named('run') {
    dependsOn(tasks.named('jvmJar'))
    classpath(tasks.named('jvmJar'))
}

shadowJar {
    archiveBaseName = 'ccompiler'
    archiveClassifier = ''
    archiveVersion = ''
    configurations = [project.configurations.jvmRuntimeClasspath]
    manifest {
        attributes 'Main-Class': 'com.hiperbou.vm.ccompilerbin.MainKt'
    }
}

// Copy the fat JAR to the root bin/ folder for easy access
tasks.register('copyToProjectBin', Copy) {
    dependsOn shadowJar
    from(shadowJar.archiveFile)
    into(rootProject.file('bin'))
}

shadowJar.finalizedBy('copyToProjectBin')
